<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wetter</title>
<style>
  :root {
    --bg: #EDF1F5;
    --card: #FFFFFF;
    --ink: #17242F;
    --muted: #5C6B78;
    --line: #D8E0E7;
    --warm: #D9662E;
    --rain: #2563C4;
    --rain-soft: #DCE9FB;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 20px 16px 32px;
    max-width: 460px;
    margin: 0 auto;
    font-size: 16px;
    line-height: 1.4;
  }
  header { margin-bottom: 18px; }
  h1 {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 2px;
  }
  .locmode {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    border-bottom: 1px dotted var(--muted);
    -webkit-tap-highlight-color: transparent;
  }
  .toggles { display: flex; gap: 8px; margin: 12px 0 0; }
  .daytoggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    width: max-content;
  }
  .daytoggle button {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--card);
    border: none;
    padding: 5px 16px;
    cursor: pointer;
  }
  .daytoggle button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
  }
  .windows { display: flex; flex-direction: column; gap: 10px; }
  .win {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .win-body {
    display: grid;
    grid-template-columns: 1fr auto auto;
    grid-template-rows: auto auto;
    column-gap: 12px;
    align-items: baseline;
    cursor: pointer;
  }
  .win-close {
    position: absolute;
    top: 4px;
    right: 6px;
    z-index: 1;
    font: inherit;
    font-size: 0.85rem;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: none;
    padding: 3px 6px;
    cursor: pointer;
    opacity: 0.55;
    -webkit-tap-highlight-color: transparent;
  }
  .win-close:hover { opacity: 1; }
  .win .sym {
    grid-row: 1 / 3;
    grid-column: 2;
    font-size: 1.55rem;
    align-self: center;
    line-height: 1;
  }
  .win.past { opacity: 0.42; }
  .win .label { font-weight: 600; font-size: 0.95rem; }
  .win .time { color: var(--muted); font-size: 0.8rem; margin-left: 6px; font-weight: 400; }
  .win .mode {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 8px;
    margin-left: 8px;
    vertical-align: 1px;
  }
  .win button.mode {
    font-family: inherit;
    line-height: inherit;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .win .temp {
    grid-row: 1 / 3;
    grid-column: 3;
    font-size: 2rem;
    font-weight: 700;
    color: var(--warm);
    font-variant-numeric: tabular-nums;
    align-self: center;
  }
  .win .temp small { font-size: 1rem; font-weight: 600; }
  .win .rain {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .win .rain.wet { color: var(--rain); font-weight: 600; }
  .addwin {
    display: block;
    margin: 12px auto 0;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: 1.5px dashed var(--line);
    background: var(--card);
    color: var(--muted);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .addwin:hover { border-color: var(--muted); color: var(--ink); }
  .addwin:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 12px 8px;
    margin-top: 14px;
  }
  .chart-title {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    padding-left: 4px;
  }
  .legend {
    display: flex;
    gap: 14px;
    font-size: 0.75rem;
    color: var(--muted);
    padding: 6px 4px 4px;
  }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: -1px;
  }
  .legend .l-temp::before { background: var(--warm); }
  .legend .l-rain::before { background: var(--rain); }
  svg { display: block; width: 100%; height: auto; }
  footer {
    margin-top: 16px;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }
  #status { padding: 40px 0; text-align: center; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .fade { animation: in 0.35s ease both; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
  .rose-backdrop {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(23, 36, 47, 0.45);
  }
  .rose-backdrop[hidden] { display: none; }
  .rose-card {
    position: relative;
    width: 100%;
    max-width: 320px;
    background: var(--card);
    border-radius: 18px;
    padding: 16px 16px 18px;
    box-shadow: 0 12px 40px rgba(23, 36, 47, 0.25);
  }
  .rose-title {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 4px;
  }
  .rose-close {
    position: absolute;
    top: 8px;
    right: 10px;
    font: inherit;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: none;
    padding: 4px 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .we-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }
  .we-row.center { justify-content: center; margin-top: 4px; }
  .we-row[hidden] { display: none; }
  .we-lbl { color: var(--muted); font-size: 0.9rem; }
  .we-seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .we-seg button {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--card);
    border: none;
    padding: 6px 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .we-seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .win-body:focus-visible,
  .win-close:focus-visible,
  .we-seg button:focus-visible,
  .we-input:focus-visible,
  .rose-close:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .we-input {
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px;
  }
  .we-dir { margin-top: 12px; }
  .we-dir[hidden] { display: none; }
  .we-dirlbl {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 2px;
  }
  #we-rose { max-width: 260px; margin: 0 auto; }
  .we-name {
    display: block;
    width: 100%;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    color: var(--ink);
    background: none;
    border: none;
    border-bottom: 1px dotted var(--line);
    padding: 2px 26px 5px;
    margin-bottom: 6px;
  }
  .we-name::placeholder { color: var(--muted); font-weight: 400; }
  .we-name:focus-visible { outline: none; border-bottom-color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1 id="title">Wetter</h1>
  <div class="sub" id="loc">Standort wird ermittelt …</div>
  <div class="toggles" id="toggles" hidden>
    <div class="daytoggle">
      <button id="btn-today" aria-pressed="true">Heute</button>
      <button id="btn-tomorrow" aria-pressed="false">Morgen</button>
    </div>
    <div class="daytoggle">
      <button id="btn-arbeit" aria-pressed="true">Arbeit</button>
      <button id="btn-freizeit" aria-pressed="false">Freizeit</button>
    </div>
  </div>
</header>

<div id="status">Lade Wetterdaten …</div>
<main id="app" hidden>
  <div class="windows" id="windows"></div>
  <button type="button" id="addwin" class="addwin" aria-label="Zeitfenster hinzufügen">+</button>
  <div class="chart-card fade">
    <div class="chart-title">Tagesverlauf</div>
    <div id="chart"></div>
    <div class="legend">
      <span class="l-temp">gefühlt °C</span>
      <span class="l-rain">Regen mm/h</span>
    </div>
  </div>
  <footer id="foot"></footer>
</main>

<div id="win-editor" class="rose-backdrop" hidden>
  <div class="rose-card fade" role="dialog" aria-modal="true" aria-label="Fenster anpassen">
    <input type="text" id="we-name" class="we-name" maxlength="24" autocomplete="off" aria-label="Name des Fensters" placeholder="Fenster">
    <div class="we-row center">
      <div class="we-seg" id="we-mode" role="group" aria-label="Fortbewegung">
        <button type="button" data-mode="Velo">Velo</button>
        <button type="button" data-mode="zu Fuss">zu Fuss</button>
      </div>
    </div>
    <div class="we-row">
      <label class="we-lbl" for="we-start">Start</label>
      <input type="time" id="we-start" step="900" class="we-input">
    </div>
    <div class="we-row">
      <label class="we-lbl" for="we-dur">Dauer</label>
      <select id="we-dur" class="we-input"></select>
    </div>
    <div class="we-dir" id="we-dir">
      <div class="we-dirlbl" id="we-dirlbl">Richtung</div>
      <div id="we-rose"></div>
    </div>
    <button id="we-close" class="rose-close" type="button" aria-label="Schliessen">✕</button>
  </div>
</div>

<script>
// Fenster-Vorgaben: Startzeit + Dauer (in Stunden), Fortbewegung und – bei Velo –
// Fahrtrichtung (heading in Grad, 0° = N, 90° = O …). Der Nutzer kann alle vier
// pro Fenster im Fenster-Dialog anpassen; die Werte werden als Overrides in
// localStorage gespeichert. Anzeige-Zeit und Stunden-Auswahl werden abgeleitet.
const WINDOW_SETS = {
  arbeit: [
    { label: "Hinweg",  mode: "Velo",    start: 7.5, dur: 0.5, heading: 45  },
    { label: "Mittag",  mode: "zu Fuss", start: 12,  dur: 1,   heading: 45  },
    { label: "Rückweg", mode: "Velo",    start: 17,  dur: 0.5, heading: 225 }
  ],
  freizeit: [
    { label: "Vormittag",  mode: "zu Fuss", start: 9,  dur: 1, heading: 45 },
    { label: "Mittag",     mode: "zu Fuss", start: 12, dur: 1, heading: 45 },
    { label: "Nachmittag", mode: "zu Fuss", start: 15, dur: 1, heading: 45 }
  ]
};
const RIDE_KMH = 20; // Fahrgeschwindigkeit Velo (0° = N, 90° = O, 180° = S, 270° = W)

// 16-teilige deutsche Windrose (22,5°-Schritte).
const DIR16 = ["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function dirLabel(deg) {
  return DIR16[Math.round(deg / 22.5) % 16];
}

// Fenster sind vollständig benutzerverwaltet: pro Set eine Liste kompletter
// Fenster-Objekte { id, label, start, dur, mode, heading } in localStorage.
// WINDOW_SETS dient nur noch als Startvorlage (Seeding beim Erststart bzw. wenn
// ein Set noch nie gespeichert wurde). Alte, indexbasierte Overrides werden
// einmalig verlustfrei ins neue Format migriert. Eine leere Liste ist ein
// gültiger Zustand (alle Fenster entfernt) und wird nicht neu geseedet.
function getStore() {
  try { return JSON.parse(localStorage.getItem("wetterWindows") || "null") || {}; }
  catch (e) { return {}; }
}
function saveStore(store) {
  localStorage.setItem("wetterWindows", JSON.stringify(store));
}
let winSeq = 0;
function newId() {
  return "w" + Date.now().toString(36) + "-" + (winSeq++).toString(36);
}
// Vollständige Fensterliste aus der Vorlage bauen, optional mit alten Overrides
// (ov[i] = { start?, dur?, mode?, heading? }) überlagert. Ohne ov = reines Seed.
function buildFromTemplate(set, ov) {
  ov = ov || [];
  return WINDOW_SETS[set].map((w, i) => {
    const o = ov[i] || {};
    return {
      id: newId(),
      label: w.label,
      start: o.start != null ? o.start : w.start,
      dur: o.dur != null ? o.dur : w.dur,
      mode: o.mode != null ? o.mode : w.mode,
      heading: o.heading != null ? o.heading : w.heading
    };
  });
}
// Gespeicherte Rohliste eines Sets, bei Bedarf geseedet/migriert und persistiert.
function rawSet(set) {
  const store = getStore();
  let arr = store[set];
  if (!Array.isArray(arr)) {
    arr = buildFromTemplate(set);            // nichts gespeichert → Vorlage
  } else if (arr.some(w => w && w.id == null)) {
    arr = buildFromTemplate(set, arr);       // altes Override-Format → migrieren
  } else {
    return arr.filter(Boolean);              // neues Format, unverändert
  }
  store[set] = arr;
  saveStore(store);
  return arr;
}
function updateWindow(set, id, patch) {
  rawSet(set);
  const store = getStore();
  const w = (store[set] || []).find(x => x && x.id === id);
  if (w) { Object.assign(w, patch); saveStore(store); }
}
function removeWindow(set, id) {
  rawSet(set);
  const store = getStore();
  if (Array.isArray(store[set])) {
    store[set] = store[set].filter(x => x && x.id !== id);
    saveStore(store);
  }
}
// Neues Fenster ans Ende der Liste; Startwerte vom spätesten Fenster abgeleitet
// (Modus/Richtung übernommen, Start = dessen Ende). Gibt die neue id zurück.
function addWindow(set) {
  const arr = rawSet(set).slice();
  const last = arr.slice().sort((a, b) => a.start - b.start).pop();
  const w = {
    id: newId(),
    label: "Fenster",
    start: last ? Math.min(last.start + last.dur, 23.5) : 8,
    dur: 0.5,
    mode: last ? last.mode : "Velo",
    heading: last ? last.heading : 45
  };
  const store = getStore();
  store[set] = arr.concat(w);
  saveStore(store);
  return w.id;
}

// Dezimalstunde ⇄ Anzeige/Eingabe
function splitHM(h) {
  let H = Math.floor(h + 1e-9), M = Math.round((h - H) * 60);
  if (M === 60) { H += 1; M = 0; }
  return [H, M];
}
function fmtTime(h) {
  const [H, M] = splitHM(h);
  return H + ":" + String(M).padStart(2, "0");
}
function toTimeValue(h) {
  const [H, M] = splitHM(h);
  return String(H).padStart(2, "0") + ":" + String(M).padStart(2, "0");
}
function parseTime(v) {
  const [a, b] = String(v).split(":").map(Number);
  return (a || 0) + (b || 0) / 60;
}
// Stundenindizes, die das Fenster [start, end) berührt (für Mittelung von
// Temperatur/Regen): jede angebrochene Datenstunde [h, h+1).
function hourIndices(start, end) {
  const lo = Math.max(0, Math.floor(start));
  const hi = Math.min(23, Math.max(lo, Math.ceil(end) - 1));
  const out = [];
  for (let i = lo; i <= hi; i++) out.push(i);
  return out;
}
// Effektive Fenster eines Sets: gespeicherte Liste mit abgeleiteten Feldern
// (time, from/to, hours), chronologisch nach Startzeit sortiert.
function windowsFor(set) {
  return rawSet(set).map(w => {
    const end = Math.min(w.start + w.dur, 24);
    return {
      id: w.id, label: w.label, mode: w.mode, heading: w.heading, start: w.start, dur: w.dur,
      from: w.start, to: end,
      time: fmtTime(w.start) + "–" + fmtTime(end),
      hours: hourIndices(w.start, end)
    };
  }).sort((a, b) => a.start - b.start);
}
// Fahrtrichtung fürs Fahrtwind-Modell: nur bei Velo, sonst kein Fahrtwind.
function headingFor(w) {
  return w.mode === "Velo" ? w.heading : null;
}
const THUNDER_CODES = [95, 96, 99];

// WMO weather_code -> Symbol + Beschreibung, absteigend nach Schwere geprüft
function weatherSymbol(code) {
  if (code >= 95) return ["⛈️", "Gewitter"];
  if (code >= 85) return ["🌨️", "Schneeschauer"];
  if (code >= 80) return ["🌦️", "Regenschauer"];
  if (code >= 71) return ["🌨️", "Schnee"];
  if ([56, 57, 66, 67].includes(code)) return ["🧊", "Eisglätte"];
  if (code >= 61) return ["🌧️", "Regen"];
  if (code >= 51) return ["🌦️", "Nieselregen"];
  if (code >= 45) return ["🌫️", "Nebel"];
  if (code === 3)  return ["☁️", "bedeckt"];
  if (code === 2)  return ["⛅", "teils bewölkt"];
  if (code === 1)  return ["🌤️", "leicht bewölkt"];
  return ["☀️", "klar"];
}
// Notnagel, falls beim allerersten Start die Ortung fehlschlägt und noch nichts
// gespeichert ist — sonst gäbe es gar kein Wetter. Sonst wird nie geortet, ohne
// dass der Nutzer den Namen antippt.
const FALLBACK = { lat: 47.5596, lon: 7.5886, name: "Basel" };

// Aktuellen Standort abfragen (nur bei ausdrücklicher Aktion bzw. Erststart).
// maxAge = wie alt ein gecachter Geräte-Fix sein darf: beim bewussten Neu-Orten
// 0 (frische Messung), beim Erststart darf ein junger Cache-Fix genügen.
function getPos(maxAge) {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolve(null),
      { timeout: 6000, maximumAge: maxAge }
    );
  });
}

// geo.admin identify (nur Schweiz) auf einen Layer, gibt die results zurück.
async function geoIdentify(lat, lon, layer, limit) {
  const url = "https://api3.geo.admin.ch/rest/services/all/MapServer/identify"
    + "?geometry=" + lon + "," + lat
    + "&geometryType=esriGeometryPoint&geometryFormat=geojson&sr=4326"
    + "&layers=all:" + layer
    + "&imageDisplay=1000,1000,96&tolerance=0&limit=" + limit + "&returnGeometry=false";
  const res = await fetch(url);
  if (!res.ok) throw new Error("geo.admin " + res.status);
  return (await res.json()).results || [];
}

// Koordinaten -> Ortsname via geo.admin (nur Schweiz, erste Stufe des
// zweistufigen Fallbacks). Bevorzugt die Ortschaft (feiner, z. B. eingemeindete
// Namen mit eigener PLZ wie "Matten (St. Stephan)"), sonst die politische
// Gemeinde. Liefert null, wenn nichts passt oder der Dienst nicht erreichbar ist
// (= vermutlich Ausland → Aufrufer versucht dann den globalen Geocoder).
// Rückgabe { name, reached }: reached=true, sobald geo.admin geantwortet hat.
// So kann der Aufrufer "erreicht, aber kein CH-Treffer" (= echtes Ausland) von
// "Dienst nicht erreichbar" (Ausfall) unterscheiden und bei einem Ausfall nicht
// fälschlich Ausland cachen.
async function resolveName(lat, lon) {
  let reached = false;
  // 1. Ortschaftenverzeichnis: Ortschaftsname im Feld langtext
  try {
    const r = await geoIdentify(lat, lon, "ch.swisstopo-vd.ortschaftenverzeichnis_plz", 1);
    reached = true;
    if (r[0]?.properties?.langtext) return { name: r[0].properties.langtext, reached };
  } catch (e) {}
  // 2. Fallback politische Gemeinde. Der Layer enthält historische Jahresstände,
  // darum den aktuellen herauspicken (limit hoch genug für alle Jahre am Punkt).
  try {
    const r = await geoIdentify(lat, lon, "ch.swisstopo.swissboundaries3d-gemeinde-flaeche.fill", 200);
    reached = true;
    const cur = r.find(f => f.properties?.is_current_jahr === true);
    if (cur?.properties?.gemname) return { name: cur.properties.gemname, reached };
  } catch (e) {}
  return { name: null, reached };
}

// Koordinaten -> Ortsname global (zweite Stufe, Ausland) via BigDataCloud.
// Kein API-Key, CORS-fähig. Bevorzugt die Stadt, sonst die feinere Ortschaft.
// Liefert null bei Fehler oder ohne brauchbaren Namen (Aufrufer zeigt dann die
// Koordinaten). Fair Use: nur vom Gerät für dessen aktuelle Position aufrufen —
// erfüllt, da lat/lon aus getCurrentPosition stammen.
async function resolveNameGlobal(lat, lon) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  try {
    const url = "https://api-bdc.net/data/reverse-geocode-client"
      + "?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=de";
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error("bigdatacloud " + res.status);
    const d = await res.json();
    return d.city || d.locality || null;
  } catch (e) { return null; }
  finally { clearTimeout(timer); }
}

function coordName(lat, lon) {
  return lat.toFixed(2) + ", " + lon.toFixed(2);
}

// Standort bestimmen: gecacht (normales Öffnen) oder frisch orten (locate=true;
// Klick auf den Namen bzw. Erststart ohne Cache). Bei fehlgeschlagener Ortung
// bleibt der alte Standort erhalten (am Namen sieht man, dass nichts kam).
async function resolveLocation(locate, fresh) {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem("wetterLoc") || "null"); } catch (e) {}
  if (!locate && cached) return cached;
  const live = await getPos(fresh ? 0 : 600000);
  if (!live) return cached || { ...FALLBACK };
  // Stufe 1 geo.admin (CH): liefert es einen Namen → Schweiz (ch:true →
  // MeteoSwiss). War es erreichbar, fand aber nichts → echtes Ausland (ch:false →
  // best_match) und Stufe 2 global (BigDataCloud) für den Namen. War geo.admin
  // nicht erreichbar (Ausfall), bleibt ch unbestimmt: nicht als Ausland cachen,
  // Standort galt bisher als CH → Default-Modell MeteoSwiss.
  const geo = await resolveName(live.lat, live.lon);
  const loc = { lat: live.lat, lon: live.lon, name: geo.name };
  if (geo.name) {
    loc.ch = true;
  } else {
    loc.name = await resolveNameGlobal(live.lat, live.lon) || coordName(live.lat, live.lon);
    if (geo.reached) loc.ch = false;
  }
  localStorage.setItem("wetterLoc", JSON.stringify(loc));
  return loc;
}

async function loadWeather(pos) {
  // In der Schweiz das MeteoSwiss-Modell, im Ausland best_match (Open-Meteo
  // wählt automatisch das beste lokale Modell). Altbestand ohne ch-Feld gilt als
  // Schweiz (Standort war bisher immer CH).
  const model = pos.ch === false ? "best_match" : "meteoswiss_icon_seamless";
  const url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + pos.lat.toFixed(4)
    + "&longitude=" + pos.lon.toFixed(4)
    + "&hourly=apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day"
    + "&forecast_days=2&timezone=auto&models=" + model;
  const res = await fetch(url);
  if (!res.ok) throw new Error("API " + res.status);
  return res.json();
}

// Gefühlte Temperatur inkl. Fahrtwind: relative Anströmung = Windvektor minus
// Fahrvektor; die Differenz zur reinen Windgeschwindigkeit geht mit Steadmans
// Windterm (−0.7 °C pro m/s) in die gefühlte Temperatur ein.
function rideAdjust(tempAT, windKmh, windDirDeg, headingDeg) {
  const rad = Math.PI / 180;
  // Windrichtung ist "woher" — Luftbewegung zeigt in die Gegenrichtung
  const ax = -windKmh * Math.sin(windDirDeg * rad);
  const ay = -windKmh * Math.cos(windDirDeg * rad);
  const rx = RIDE_KMH * Math.sin(headingDeg * rad);
  const ry = RIDE_KMH * Math.cos(headingDeg * rad);
  const effKmh = Math.hypot(ax - rx, ay - ry);
  return tempAT - 0.7 * (effKmh - windKmh) / 3.6;
}

function fmt(n, digits = 0) {
  return n.toLocaleString("de-CH", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

// Nutzer-Eingaben (Fenster-Namen) landen in innerHTML/SVG → escapen.
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderWindows(h, nowHour, windows) {
  const box = document.getElementById("windows");
  box.innerHTML = "";
  windows.forEach((w, i) => {
    const heading = headingFor(w);
    const temps = w.hours.map(i => {
      const t = h.apparent_temperature[i];
      if (heading == null || h.wind_speed_10m?.[i] == null || h.wind_direction_10m?.[i] == null) return t;
      return rideAdjust(t, h.wind_speed_10m[i], h.wind_direction_10m[i], heading);
    });
    const temp = temps.reduce((a, b) => a + b, 0) / temps.length;
    const prob = Math.max(...w.hours.map(i => h.precipitation_probability[i] ?? 0));
    const mm = w.hours.reduce((a, i) => a + (h.precipitation[i] ?? 0), 0);
    const past = nowHour > Math.max(...w.hours);
    const thunder = w.hours.some(i => THUNDER_CODES.includes(h.weather_code[i]));
    const wet = prob >= 30 || mm >= 0.2 || thunder;
    let rainText = wet
      ? "Regen " + prob + " % · " + fmt(mm, 1) + " mm"
      : "trocken (" + prob + " %)";
    if (thunder) rainText += " · Gewitter möglich";
    const [sym, symText] = weatherSymbol(Math.max(...w.hours.map(i => h.weather_code[i] ?? 0)));
    const el = document.createElement("div");
    el.className = "win fade" + (past ? " past" : "");
    el.dataset.id = w.id;
    el.innerHTML =
      '<button class="win-close" type="button" aria-label="Fenster entfernen">✕</button>' +
      '<div class="win-body" role="button" tabindex="0" aria-label="' + esc(w.label) + ' anpassen">' +
      '<div><span class="label">' + esc(w.label) + '</span>' +
      '<span class="time">' + w.time + '</span>' +
      (w.mode === "Velo"
        ? '<span class="mode">Velo · ' + dirLabel(w.heading) + '</span>'
        : '') + '</div>' +
      '<div class="sym" role="img" title="' + symText + '" aria-label="' + symText + '">' + sym + '</div>' +
      '<div class="temp">' + fmt(temp) + '<small>°</small></div>' +
      '<div class="rain' + (wet ? " wet" : "") + '">' + (past ? "vorbei · " : "") + rainText + '</div>' +
      '</div>';
    box.appendChild(el);
  });
}

function renderChart(h, nowHour, windows) {
  const W = 420, H = 192, padL = 30, padR = 8, padT = 56, padB = 22;
  const temps = h.apparent_temperature.slice(0, 24);
  const rain = h.precipitation.slice(0, 24).map(v => v ?? 0);
  // Achsengrenzen auf Vielfache von 3 gerundet (mit mind. 1° Abstand zur Kurve),
  // damit die 3°-Hilfslinien immer auf mod-3-Zahlen liegen
  const tMin = Math.floor((Math.min(...temps) - 1) / 3) * 3;
  const tMax = Math.ceil((Math.max(...temps) + 1) / 3) * 3;
  const rMax = Math.max(1.5, ...rain);
  const x = i => padL + (i / 23) * (W - padL - padR);
  const yT = v => padT + (1 - (v - tMin) / (tMax - tMin)) * (H - padT - padB);
  const yR = v => H - padB - (v / rMax) * (H - padT - padB) * 0.55;

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Tagesverlauf gefühlte Temperatur und Regen">';

  // Hilfslinien: alle 3 h / 3 °C, Hauptlinien (alle 6) leicht kräftiger
  for (let hr = 0; hr <= 23; hr += 3) {
    s += '<line x1="' + x(hr) + '" y1="' + padT + '" x2="' + x(hr) + '" y2="' + (H - padB) + '" stroke="#17242F" stroke-width="1" opacity="' + (hr % 6 === 0 ? 0.11 : 0.05) + '"/>';
  }
  for (let v = tMin; v <= tMax; v += 3) {
    s += '<line x1="' + padL + '" y1="' + yT(v) + '" x2="' + (W - padR) + '" y2="' + yT(v) + '" stroke="#17242F" stroke-width="1" opacity="' + (v % 6 === 0 ? 0.11 : 0.05) + '"/>';
  }

  // Wetter-Icons alle 3 h am oberen Rand; klar/bewölkt nachts als Mond/Wolke,
  // da weather_code nicht zwischen Tag und Nacht unterscheidet
  for (let hr = 0; hr <= 23; hr += 3) {
    const code = h.weather_code[hr] ?? 0;
    let [sym, symText] = weatherSymbol(code);
    if (h.is_day?.[hr] === 0 && code <= 2) [sym, symText] = code <= 1 ? ["🌙", "klar"] : ["☁️", "bewölkt"];
    s += '<text x="' + x(hr) + '" y="30" text-anchor="middle" font-size="28"' + (hr < nowHour ? ' opacity="0.42"' : '') + '><title>' + symText + '</title>' + sym + '</text>';
  }

  // Fenster-Zonen (echte Zeitfenster, nicht die Datenstunden)
  windows.forEach(w => {
    const x0 = x(w.from), x1 = x(w.to);
    s += '<rect x="' + x0 + '" y="' + padT + '" width="' + (x1 - x0) + '" height="' + (H - padT - padB) + '" fill="#17242F" opacity="0.06" rx="4"/>';
    s += '<text x="' + ((x0 + x1) / 2) + '" y="' + (padT - 4) + '" text-anchor="middle" font-size="9" fill="#5C6B78">' + esc(w.label) + '</text>';
  });

  // Regenbalken
  rain.forEach((v, i) => {
    if (v <= 0) return;
    const bw = (W - padL - padR) / 24 - 2;
    s += '<rect x="' + (x(i) - bw / 2) + '" y="' + yR(v) + '" width="' + bw + '" height="' + (H - padB - yR(v)) + '" fill="#2563C4" opacity="0.75" rx="2"/>';
  });

  // Temperaturkurve
  const path = temps.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + yT(v).toFixed(1)).join(" ");
  s += '<path d="' + path + '" fill="none" stroke="#D9662E" stroke-width="2.5" stroke-linecap="round"/>';

  // Jetzt-Linie
  if (nowHour >= 0 && nowHour < 24) {
    const nx = x(nowHour + new Date().getMinutes() / 60);
    s += '<line x1="' + nx + '" y1="' + padT + '" x2="' + nx + '" y2="' + (H - padB) + '" stroke="#17242F" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>';
  }

  // Achsen-Labels
  [0, 6, 12, 18, 23].forEach(hr => {
    s += '<text x="' + x(hr) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="#5C6B78">' + hr + '</text>';
  });
  // Temperaturachse alle 6° angeschrieben (gleiche Major-Ticks wie die Zeitachse)
  for (let v = Math.ceil(tMin / 6) * 6; v <= tMax; v += 6) {
    s += '<text x="2" y="' + (yT(v) + 3) + '" font-size="9" fill="#5C6B78">' + v + '°</text>';
  }

  s += "</svg>";
  document.getElementById("chart").innerHTML = s;
}

// Windrose (im Fenster-Dialog eingebettet): 16 anklickbare Sektoren
// (data-angle = Fahrtrichtung des Fensters), aktueller Sektor dunkel gefüllt.
// Farben fest (CSS-Variablen wirken nicht in
// SVG-Präsentationsattributen).
function buildRose(heading) {
  const cx = 140, cy = 140, R = 110, lr = 128;
  const selIdx = Math.round(heading / 22.5) % 16;
  const pol = (deg, r) => [cx + r * Math.sin(deg * Math.PI / 180), cy - r * Math.cos(deg * Math.PI / 180)];
  let s = '<svg viewBox="0 0 280 280" role="group" aria-label="Windrose">';
  s += '<circle cx="140" cy="140" r="110" fill="none" stroke="#D8E0E7" stroke-width="1"/>';
  for (let i = 0; i < 16; i++) {
    const a = i * 22.5;
    const [x0, y0] = pol(a - 11.25, R);
    const [x1, y1] = pol(a + 11.25, R);
    const on = i === selIdx;
    s += '<path data-angle="' + a + '" style="cursor:pointer" '
      + 'd="M140 140 L' + x0.toFixed(1) + ' ' + y0.toFixed(1)
      + ' A110 110 0 0 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" '
      + 'fill="' + (on ? '#17242F' : '#FFFFFF') + '" stroke="#D8E0E7" stroke-width="1"/>';
  }
  // Beschriftung der 8 Hauptrichtungen; N/O/S/W kräftiger
  [[0,"N",1],[45,"NO",0],[90,"O",1],[135,"SO",0],[180,"S",1],[225,"SW",0],[270,"W",1],[315,"NW",0]]
    .forEach(([a, t, big]) => {
      const [lx, ly] = pol(a, lr);
      s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="middle" '
        + 'font-size="' + (big ? 15 : 12) + '" font-weight="' + (big ? 700 : 600) + '" '
        + 'fill="' + (big ? '#17242F' : '#5C6B78') + '">' + t + '</text>';
    });
  s += '<circle cx="140" cy="140" r="3" fill="#5C6B78"/>';
  s += '</svg>';
  return s;
}

let editingId = null;
let lastFocused = null;

// Fenster-Dialog: Name, Fortbewegung, Start, Dauer und (bei Velo) Richtung anpassen.
function openWinEditor(id) {
  editingId = id;
  const w = windowsFor(currentSet).find(x => x.id === id);
  if (!w) return;
  document.getElementById("we-name").value = w.label;
  document.querySelectorAll("#we-mode button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === w.mode));
  document.getElementById("we-start").value = toTimeValue(w.start);
  buildDurOptions(w.dur);
  updateDirRow(w);
  document.getElementById("win-editor").hidden = false;
  lastFocused = document.activeElement;
  document.querySelector("#we-mode button[aria-pressed='true']")?.focus();
}
function closeWinEditor() {
  document.getElementById("win-editor").hidden = true;
  lastFocused?.focus?.();
}
function fmtDur(h) {
  const H = Math.floor(h), M = Math.round((h - H) * 60);
  return H + ":" + String(M).padStart(2, "0");
}
function buildDurOptions(sel) {
  let html = "", found = false;
  for (let d = 0.25; d <= 4.001; d += 0.25) {
    const on = Math.abs(d - sel) < 0.01;
    if (on) found = true;
    html += '<option value="' + d.toFixed(2) + '"' + (on ? " selected" : "") + '>' + fmtDur(d) + '</option>';
  }
  if (!found) html = '<option value="' + sel + '" selected>' + fmtDur(sel) + '</option>' + html;
  document.getElementById("we-dur").innerHTML = html;
}
// Richtungsbereich (eingebettete Windrose) im Fenster-Dialog: nur bei Velo.
function updateDirRow(w) {
  const box = document.getElementById("we-dir");
  box.hidden = w.mode !== "Velo";
  if (w.mode !== "Velo") return;
  document.getElementById("we-dirlbl").textContent = "Richtung: " + dirLabel(w.heading);
  document.getElementById("we-rose").innerHTML = buildRose(w.heading);
}
function pickHeading(deg) {
  updateWindow(currentSet, editingId, { heading: ((deg % 360) + 360) % 360 });
  updateDirRow(windowsFor(currentSet).find(x => x.id === editingId));
  render();
}

let hourlyData = null;
let posName = "";
let loadedAt = "";
let loadedAtMs = 0;
let loadedDate = "";
let currentDay = 0;
let currentSet = "arbeit";
let locating = false;

// Samstag/Sonntag standardmässig Freizeit-Fenster
function defaultSetFor(day) {
  const d = new Date();
  d.setDate(d.getDate() + day);
  const wd = d.getDay();
  return wd === 0 || wd === 6 ? "freizeit" : "arbeit";
}

function sliceDay(h, day) {
  const from = day * 24, to = from + 24;
  return {
    apparent_temperature: h.apparent_temperature.slice(from, to),
    precipitation_probability: h.precipitation_probability.slice(from, to),
    precipitation: h.precipitation.slice(from, to),
    weather_code: h.weather_code.slice(from, to),
    wind_speed_10m: h.wind_speed_10m.slice(from, to),
    wind_direction_10m: h.wind_direction_10m.slice(from, to),
    is_day: (h.is_day || []).slice(from, to)
  };
}

function renderDay(day) {
  currentDay = day;
  currentSet = defaultSetFor(day);
  render();
}

function renderSet(set) {
  currentSet = set;
  render();
}

function render() {
  const d = new Date();
  d.setDate(d.getDate() + currentDay);
  const dateStr = d.toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("loc").innerHTML =
    '<button type="button" id="locmode" class="locmode">' + posName + '</button> · ' + dateStr;
  document.getElementById("btn-today").setAttribute("aria-pressed", currentDay === 0);
  document.getElementById("btn-tomorrow").setAttribute("aria-pressed", currentDay === 1);
  document.getElementById("btn-arbeit").setAttribute("aria-pressed", currentSet === "arbeit");
  document.getElementById("btn-freizeit").setAttribute("aria-pressed", currentSet === "freizeit");
  const nowHour = currentDay === 0 ? new Date().getHours() : -1;
  const windows = windowsFor(currentSet);
  renderWindows(sliceDay(hourlyData, currentDay), nowHour, windows);
  renderChart(sliceDay(hourlyData, currentDay), nowHour, windows);
  document.getElementById("foot").textContent =
    (windows.some(w => w.mode === "Velo") ? "VELO: gefühlt inkl. Fahrtwind (" + RIDE_KMH + " km/h) · " : "") +
    "Daten: Open-Meteo · Stand " + loadedAt;
}

// Klick auf den Namen: neu orten, Gemeinde auflösen und Wetter neu laden.
// Reload läuft asynchron; Doppel-Tipps werden blockiert.
async function relocate() {
  if (locating) return;
  locating = true;
  const modeEl = document.getElementById("locmode");
  if (modeEl) modeEl.textContent = "…";
  try { await loadData(true, true); } catch (e) {}
  render();
  locating = false;
}

async function loadData(locate, fresh) {
  const pos = await resolveLocation(locate, fresh);
  posName = pos.name;
  const data = await loadWeather(pos);
  hourlyData = data.hourly;
  const now = new Date();
  loadedAt = now.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" });
  loadedAtMs = now.getTime();
  loadedDate = now.toDateString();
}

async function init() {
  const status = document.getElementById("status");
  try {
    // Erststart ohne gespeicherten Standort: direkt orten. Sonst Cache nutzen.
    await loadData(!localStorage.getItem("wetterLoc"));
    document.getElementById("btn-today").onclick = () => renderDay(0);
    document.getElementById("btn-tomorrow").onclick = () => renderDay(1);
    document.getElementById("btn-arbeit").onclick = () => renderSet("arbeit");
    document.getElementById("btn-freizeit").onclick = () => renderSet("freizeit");
    renderDay(new Date().getHours() >= 20 ? 1 : 0);
    status.hidden = true;
    document.getElementById("toggles").hidden = false;
    document.getElementById("app").hidden = false;
  } catch (e) {
    status.textContent = "Wetterdaten konnten nicht geladen werden. Verbindung prüfen und Seite neu laden.";
  }
}

// iOS friert die Homescreen-App ein und stellt sie beim Öffnen ohne Neuladen
// wieder her. Deshalb beim Zurückkehren: neu rendern (Jetzt-Linie, ausgegraute
// Fenster), abgestandene Daten neu laden und auf eine neu deployte Version
// prüfen.
const STALE_MS = 10 * 60 * 1000;
let baselineHtml = null;
let refreshing = false;

function fetchSelf() {
  return fetch(location.pathname, { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  });
}

async function checkVersion() {
  try {
    const html = await fetchSelf();
    const changed = baselineHtml !== null && html !== baselineHtml;
    baselineHtml = html;
    if (!changed) return;
    const last = Number(sessionStorage.getItem("wetterReload")) || 0;
    if (Date.now() - last < 60000) return; // Schleifen-Schutz
    sessionStorage.setItem("wetterReload", Date.now());
    // Query-Parameter umgeht Browser- und CDN-Cache, sonst käme wieder die alte Version
    location.replace(location.pathname + "?u=" + Date.now());
  } catch (e) {}
}

async function onResume() {
  if (refreshing) return;
  refreshing = true;
  try {
    checkVersion();
    if (!hourlyData) { await init(); return; }
    const dayChanged = new Date().toDateString() !== loadedDate;
    if (dayChanged || Date.now() - loadedAtMs > STALE_MS) {
      try { await loadData(); } catch (e) {}
    }
    if (dayChanged) renderDay(new Date().getHours() >= 20 ? 1 : 0);
    else render();
  } finally {
    refreshing = false;
  }
}

window.addEventListener("pageshow", e => { if (e.persisted) onResume(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) onResume(); });
document.getElementById("loc").addEventListener("click", e => {
  if (e.target.closest("#locmode")) relocate();
});
document.getElementById("windows").addEventListener("click", e => {
  const closeBtn = e.target.closest(".win-close");
  if (closeBtn) {
    removeWindow(currentSet, closeBtn.closest(".win").dataset.id);
    render();
    return;
  }
  const el = e.target.closest(".win");
  if (el) openWinEditor(el.dataset.id);
});
document.getElementById("addwin").addEventListener("click", () => {
  const id = addWindow(currentSet);
  render();
  openWinEditor(id);
});
document.getElementById("win-editor").addEventListener("click", e => {
  if (e.target === e.currentTarget || e.target.closest("#we-close")) return closeWinEditor();
  const modeBtn = e.target.closest("#we-mode button");
  if (modeBtn) {
    updateWindow(currentSet, editingId, { mode: modeBtn.dataset.mode });
    const w = windowsFor(currentSet).find(x => x.id === editingId);
    document.querySelectorAll("#we-mode button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.mode === w.mode));
    updateDirRow(w);
    render();
    return;
  }
  const seg = e.target.closest("[data-angle]");
  if (seg) pickHeading(Number(seg.getAttribute("data-angle")));
});
document.getElementById("we-start").addEventListener("change", e => {
  // Leeres Feld (z. B. via „löschen") nicht als Mitternacht speichern
  if (!e.target.value) {
    const cur = windowsFor(currentSet).find(x => x.id === editingId);
    if (cur) e.target.value = toTimeValue(cur.start);
    return;
  }
  updateWindow(currentSet, editingId, { start: parseTime(e.target.value) });
  render();
});
// Name live speichern; beim Verlassen leeres Feld auf Standard zurücksetzen.
document.getElementById("we-name").addEventListener("input", e => {
  updateWindow(currentSet, editingId, { label: e.target.value });
  render();
});
document.getElementById("we-name").addEventListener("change", e => {
  if (!e.target.value.trim()) {
    e.target.value = "Fenster";
    updateWindow(currentSet, editingId, { label: "Fenster" });
    render();
  }
});
// Tastatur: Fenster-Karten mit Enter/Space öffnen, Dialog mit Escape schliessen
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("win-editor").hidden) return closeWinEditor();
  if (e.key === "Enter" || e.key === " ") {
    const body = e.target.closest?.(".win-body");
    if (body) { e.preventDefault(); openWinEditor(body.closest(".win").dataset.id); }
  }
});
document.getElementById("we-dur").addEventListener("change", e => {
  updateWindow(currentSet, editingId, { dur: Number(e.target.value) });
  render();
});

init();
checkVersion(); // erste Antwort dient als Vergleichsbasis
</script>
</body>
</html>
