<style>
  /* Ein Farbschema pro Systemeinstellung, kein Schalter in der App: die Wahl ist
     zu dem Zeitpunkt, um den es geht (7 Uhr im Winter, vor der Fahrt), immer schon
     getroffen. Alles Weitere unten läuft über diese Variablen. */
  :root {
    --bg: #EDF1F5;
    --card: #FFFFFF;
    --ink: #17242F;
    --muted: #5C6B78;
    --line: #D8E0E7;
    --warm: #D9662E;
    --rain: #2563C4;
    --scrim: rgba(23, 36, 47, 0.45);
    --shadow: rgba(23, 36, 47, 0.25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161B;
      --card: #1A2229;
      --ink: #E4EAF0;
      --muted: #93A2AF;
      --line: #2C3740;
      --warm: #F08A4B;
      --rain: #6FA8F5;
      --scrim: rgba(0, 0, 0, 0.6);
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    padding:
      calc(20px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(32px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
    max-width: 460px;
    margin: 0 auto;
    font-size: 16px;
    line-height: 1.4;
  }
  header { margin-bottom: 18px; }
  /* Oberste Zeile trägt den Ort — ein Titel „Wetter" sagte nichts, was der Nutzer
     nicht schon weiss, und ein Datum nichts, was der Heute/Morgen-Schalter nicht
     schon sagt. Antippen ortet neu. */
  h1 {
    font-size: 0.95rem;
    font-weight: 600;
  }
  .locmode {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    border-bottom: 1px dotted var(--muted);
    -webkit-tap-highlight-color: transparent;
  }
  .toggles { display: flex; gap: 8px; margin: 12px 0 0; }
  .daytoggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    width: max-content;
  }
  .daytoggle button {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--card);
    border: none;
    padding: 5px 16px;
    cursor: pointer;
  }
  .daytoggle button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
  }
  /* Tages-Kleiderempfehlung: die Antwort auf die Kernfrage der App, deshalb
     zuoberst — aber als blanke Textzeile, ohne Kasten und ohne Herleitung, damit
     die Daten-Ebene darunter ruhig bleibt. */
  .advice { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
  .advice .thunder { color: var(--rain); }
  .windows { display: flex; flex-direction: column; gap: 10px; }
  .win {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .win-body {
    display: grid;
    grid-template-columns: 1fr auto auto;
    grid-template-rows: auto auto;
    column-gap: 12px;
    align-items: baseline;
    cursor: pointer;
  }
  .win .sym {
    grid-row: 1 / 3;
    grid-column: 2;
    font-size: 1.55rem;
    align-self: center;
    line-height: 1;
  }
  .win.past { opacity: 0.42; }
  /* Das gerade laufende bzw. nächste Fenster: kräftigerer Rahmen als einziges
     Signal. Der box-shadow verdoppelt die Rahmenstärke optisch, ohne das Layout zu
     verschieben — alle Karten bleiben gleich hoch. Deckkraft bleibt bewusst dem
     Zustand „vorbei" vorbehalten, sonst gäbe es zwei Graustufen zu unterscheiden. */
  .win.now { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .win .label { font-weight: 600; font-size: 0.95rem; }
  .win .time { color: var(--muted); font-size: 0.8rem; margin-left: 6px; font-weight: 400; }
  .win .mode {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 8px;
    margin-left: 8px;
    vertical-align: 1px;
  }
  .win .temp {
    grid-row: 1 / 3;
    grid-column: 3;
    font-size: 2rem;
    font-weight: 700;
    color: var(--warm);
    font-variant-numeric: tabular-nums;
    align-self: center;
  }
  .win .temp small { font-size: 1rem; font-weight: 600; }
  .win .rain {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .win .rain.wet { color: var(--rain); font-weight: 600; }
  .addwin {
    display: block;
    margin: 12px auto 0;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: 1.5px dashed var(--line);
    background: var(--card);
    color: var(--muted);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .addwin:hover { border-color: var(--muted); color: var(--ink); }
  .addwin:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 12px 8px;
    margin-top: 14px;
  }
  .chart-title {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    padding-left: 4px;
  }
  .legend {
    display: flex;
    gap: 14px;
    font-size: 0.75rem;
    color: var(--muted);
    padding: 6px 4px 4px;
  }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: -1px;
  }
  .legend .l-temp::before { background: var(--warm); }
  .legend .l-rain::before { background: var(--rain); }
  svg { display: block; width: 100%; height: auto; }
  footer {
    margin-top: 16px;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }
  #status { padding: 40px 0; text-align: center; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .fade { animation: in 0.35s ease both; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
  .rose-backdrop {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--scrim);
  }
  .rose-backdrop[hidden] { display: none; }
  .rose-card {
    position: relative;
    width: 100%;
    max-width: 320px;
    background: var(--card);
    border-radius: 18px;
    padding: 16px 16px 18px;
    box-shadow: 0 12px 40px var(--shadow);
  }
  .rose-title {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 4px;
  }
  .rose-close {
    position: absolute;
    top: 8px;
    right: 10px;
    font: inherit;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: none;
    padding: 4px 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .we-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }
  .we-row.center { justify-content: center; margin-top: 4px; }
  .we-row[hidden] { display: none; }
  .we-lbl { color: var(--muted); font-size: 0.9rem; }
  .we-seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .we-seg button {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--card);
    border: none;
    padding: 6px 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .we-seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .win-body:focus-visible,
  .we-seg button:focus-visible,
  .we-input:focus-visible,
  .we-remove:focus-visible,
  .rose-close:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .we-input {
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px;
  }
  .we-dir { margin-top: 12px; }
  .we-dir[hidden] { display: none; }
  .we-dirlbl {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 2px;
  }
  #we-rose { max-width: 260px; margin: 0 auto; }
  .we-name {
    display: block;
    width: 100%;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    color: var(--ink);
    background: none;
    border: none;
    border-bottom: 1px dotted var(--line);
    padding: 2px 26px 5px;
    margin-bottom: 6px;
  }
  .we-name::placeholder { color: var(--muted); font-weight: 400; }
  .we-name:focus-visible { outline: none; border-bottom-color: var(--ink); }
  /* Löschen liegt bewusst abgesetzt am unteren Rand des Dialogs: auffindbar,
     aber weit genug von der Windrose entfernt, dass kein Fehltap hinreicht. */
  .we-remove {
    display: block;
    width: 100%;
    min-height: 44px;
    font: inherit;
    font-size: 0.9rem;
    color: var(--muted);
    background: none;
    border: none;
    border-top: 1px solid var(--line);
    margin-top: 16px;
    padding-top: 13px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .we-remove:hover { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1 id="loc"><button type="button" id="locmode" class="locmode">Standort wird ermittelt …</button></h1>
  <div class="toggles" id="toggles" hidden>
    <div class="daytoggle">
      <button id="btn-today" aria-pressed="true">Heute</button>
      <button id="btn-tomorrow" aria-pressed="false">Morgen</button>
    </div>
    <div class="daytoggle">
      <button id="btn-arbeit" aria-pressed="true">Arbeit</button>
      <button id="btn-freizeit" aria-pressed="false">Freizeit</button>
    </div>
  </div>
</header>

<div id="status">Lade Wetterdaten …</div>
<main id="app" hidden>
  <div class="advice fade" id="advice" hidden></div>
  <div class="windows" id="windows"></div>
  <button type="button" id="addwin" class="addwin" aria-label="Zeitfenster hinzufügen">+</button>
  <div class="chart-card fade">
    <div class="chart-title">Tagesverlauf</div>
    <div id="chart"></div>
    <div class="legend">
      <span class="l-temp">gefühlt °C</span>
      <span class="l-rain">Regen mm/h</span>
    </div>
  </div>
  <footer id="foot"></footer>
</main>

<div id="win-editor" class="rose-backdrop" hidden>
  <div class="rose-card fade" role="dialog" aria-modal="true" aria-label="Fenster anpassen">
    <input type="text" id="we-name" class="we-name" maxlength="24" autocomplete="off" aria-label="Name des Fensters" placeholder="Fenster">
    <div class="we-row center">
      <div class="we-seg" id="we-mode" role="group" aria-label="Fortbewegung">
        <button type="button" data-mode="Velo">Velo</button>
        <button type="button" data-mode="zu Fuss">zu Fuss</button>
      </div>
    </div>
    <div class="we-row">
      <label class="we-lbl" for="we-start">Start</label>
      <input type="time" id="we-start" step="900" class="we-input">
    </div>
    <div class="we-row">
      <label class="we-lbl" for="we-dur">Dauer</label>
      <select id="we-dur" class="we-input"></select>
    </div>
    <div class="we-dir" id="we-dir">
      <div class="we-dirlbl" id="we-dirlbl">Richtung</div>
      <div id="we-rose"></div>
    </div>
    <button id="we-remove" class="we-remove" type="button">Fenster entfernen</button>
    <button id="we-close" class="rose-close" type="button" aria-label="Schliessen">✕</button>
  </div>
</div>

<script>
// Fenster-Vorgaben: Startzeit + Dauer (in Stunden), Fortbewegung und – bei Velo –
// Fahrtrichtung (heading in Grad, 0° = N, 90° = O …). Der Nutzer kann alle vier
// pro Fenster im Fenster-Dialog anpassen; die Werte werden als Overrides in
// localStorage gespeichert. Anzeige-Zeit und Stunden-Auswahl werden abgeleitet.
const WINDOW_SETS = {
  arbeit: [
    { label: "Hinweg",  mode: "Velo",    start: 7.5, dur: 0.5, heading: 45  },
    { label: "Mittag",  mode: "zu Fuss", start: 12,  dur: 1,   heading: 45  },
    { label: "Rückweg", mode: "Velo",    start: 17,  dur: 0.5, heading: 225 }
  ],
  freizeit: [
    { label: "Vormittag",  mode: "zu Fuss", start: 9,  dur: 1, heading: 45 },
    { label: "Mittag",     mode: "zu Fuss", start: 12, dur: 1, heading: 45 },
    { label: "Nachmittag", mode: "zu Fuss", start: 15, dur: 1, heading: 45 }
  ]
};
const RIDE_KMH = 20; // Fahrgeschwindigkeit Velo (0° = N, 90° = O, 180° = S, 270° = W)

// Kleiderempfehlung für den ganzen Tag: persönliche Temperaturbänder, bewusst
// hart kodiert — die Datei ist bei einer persönlichen App das Einstellungsmenü.
// Massgebend ist das kälteste Fenster des Tages (fahrtwind-korrigiert): wer dafür
// angezogen ist, zieht am warmen Nachmittag eine Schicht aus, umgekehrt geht es
// nicht. min ist die Untergrenze des Bandes (inklusive); das erste passende Band
// gewinnt, die Liste muss deshalb absteigend sortiert bleiben. Bei Nässe in
// irgendeinem Fenster gilt die wet-Spalte (Regenjacke ersetzt die Windjacke).
const BANDS = [
  { min: 20,        dry: "kurz",                           wet: "kurz, Regenjacke" },
  { min: 14,        dry: "lang",                           wet: "lang, Regenjacke" },
  { min: 9,         dry: "lang, Windjacke",                wet: "lang, Regenjacke" },
  { min: 2,         dry: "Windjacke, Handschuhe",          wet: "Regenjacke, Handschuhe" },
  { min: -Infinity, dry: "Winterjacke, Handschuhe, Mütze", wet: "Winterjacke, Handschuhe, Mütze, Regenschutz" }
];

// 16-teilige deutsche Windrose (22,5°-Schritte).
const DIR16 = ["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function dirLabel(deg) {
  return DIR16[Math.round(deg / 22.5) % 16];
}

// Fenster sind vollständig benutzerverwaltet: pro Set eine Liste kompletter
// Fenster-Objekte { id, label, start, dur, mode, heading } in localStorage.
// WINDOW_SETS dient nur noch als Startvorlage (Seeding beim Erststart bzw. wenn
// ein Set noch nie gespeichert wurde). Alte, indexbasierte Overrides werden
// einmalig verlustfrei ins neue Format migriert. Eine leere Liste ist ein
// gültiger Zustand (alle Fenster entfernt) und wird nicht neu geseedet.
function getStore() {
  try { return JSON.parse(localStorage.getItem("wetterWindows") || "null") || {}; }
  catch (e) { return {}; }
}
function saveStore(store) {
  localStorage.setItem("wetterWindows", JSON.stringify(store));
}
let winSeq = 0;
function newId() {
  return "w" + Date.now().toString(36) + "-" + (winSeq++).toString(36);
}
// Vollständige Fensterliste aus der Vorlage bauen, optional mit alten Overrides
// (ov[i] = { start?, dur?, mode?, heading? }) überlagert. Ohne ov = reines Seed.
function buildFromTemplate(set, ov) {
  ov = ov || [];
  return WINDOW_SETS[set].map((w, i) => {
    const o = ov[i] || {};
    return {
      id: newId(),
      label: w.label,
      start: o.start != null ? o.start : w.start,
      dur: o.dur != null ? o.dur : w.dur,
      mode: o.mode != null ? o.mode : w.mode,
      heading: o.heading != null ? o.heading : w.heading
    };
  });
}
// Gespeicherte Rohliste eines Sets, bei Bedarf geseedet/migriert und persistiert.
function rawSet(set) {
  const store = getStore();
  let arr = store[set];
  if (!Array.isArray(arr)) {
    arr = buildFromTemplate(set);            // nichts gespeichert → Vorlage
  } else if (arr.some(w => w && w.id == null)) {
    arr = buildFromTemplate(set, arr);       // altes Override-Format → migrieren
  } else {
    return arr.filter(Boolean);              // neues Format, unverändert
  }
  store[set] = arr;
  saveStore(store);
  return arr;
}
function updateWindow(set, id, patch) {
  rawSet(set);
  const store = getStore();
  const w = (store[set] || []).find(x => x && x.id === id);
  if (w) { Object.assign(w, patch); saveStore(store); }
}
function removeWindow(set, id) {
  rawSet(set);
  const store = getStore();
  if (Array.isArray(store[set])) {
    store[set] = store[set].filter(x => x && x.id !== id);
    saveStore(store);
  }
}
// Neues Fenster ans Ende der Liste; Startwerte vom spätesten Fenster abgeleitet
// (Modus/Richtung übernommen, Start = dessen Ende). Gibt die neue id zurück.
function addWindow(set) {
  const arr = rawSet(set).slice();
  const last = arr.slice().sort((a, b) => a.start - b.start).pop();
  const w = {
    id: newId(),
    label: "Fenster",
    start: last ? Math.min(last.start + last.dur, 23.5) : 8,
    dur: 0.5,
    mode: last ? last.mode : "Velo",
    heading: last ? last.heading : 45
  };
  const store = getStore();
  store[set] = arr.concat(w);
  saveStore(store);
  return w.id;
}

// Dezimalstunde ⇄ Anzeige/Eingabe
function splitHM(h) {
  let H = Math.floor(h + 1e-9), M = Math.round((h - H) * 60);
  if (M === 60) { H += 1; M = 0; }
  return [H, M];
}
// Einheitliches Zeitformat „07:30" für Karten, Chart und Dialog. Zweistellig,
// weil das native <input type="time"> ohnehin so anzeigt und genau dieses Format
// als Wert erwartet — dieselbe Funktion dient deshalb beidem.
function fmtTime(h) {
  const [H, M] = splitHM(h);
  return String(H).padStart(2, "0") + ":" + String(M).padStart(2, "0");
}
function parseTime(v) {
  const [a, b] = String(v).split(":").map(Number);
  return (a || 0) + (b || 0) / 60;
}
// Datenstunden, die das Fenster [start, end) berührt, je mit ihrem
// Überlappungsanteil ov (in Stunden). Open-Meteo akkumuliert precipitation pro
// voller Stunde [i, i+1) — eine bloss angeschnittene Stunde darf deshalb nur
// anteilig zählen, sonst zeigt ein 30-Minuten-Fenster die Menge einer ganzen
// Stunde.
function hourSlices(start, end) {
  const lo = Math.max(0, Math.floor(start));
  const hi = Math.min(23, Math.max(lo, Math.ceil(end) - 1));
  const out = [];
  for (let i = lo; i <= hi; i++) {
    out.push({ i, ov: Math.max(0, Math.min(end, i + 1) - Math.max(start, i)) });
  }
  return out;
}
// Effektive Fenster eines Sets: gespeicherte Liste mit abgeleiteten Feldern
// (time, from/to, slices), chronologisch nach Startzeit sortiert.
function windowsFor(set) {
  return rawSet(set).map(w => {
    const end = Math.min(w.start + w.dur, 24);
    return {
      id: w.id, label: w.label, mode: w.mode, heading: w.heading, start: w.start, dur: w.dur,
      from: w.start, to: end,
      time: fmtTime(w.start) + "–" + fmtTime(end),
      slices: hourSlices(w.start, end)
    };
  }).sort((a, b) => a.start - b.start);
}
// Fahrtrichtung fürs Fahrtwind-Modell: nur bei Velo, sonst kein Fahrtwind.
function headingFor(w) {
  return w.mode === "Velo" ? w.heading : null;
}
const THUNDER_CODES = [95, 96, 99];

// WMO weather_code -> Symbol + Beschreibung, absteigend nach Schwere aus
// Velo-Sicht. Die Reihenfolge ist gleichzeitig die Rangfolge: sie entscheidet in
// worstSymbol(), welche von mehreren Stunden das Symbol eines Fensters stellt.
// Deshalb steht Eisglätte über Schnee (gefrierender Regen ist fürs Velo
// gefährlicher) und Schnee über Regenschauer. Die Tests sind bewusst Bereiche und
// keine offenen Untergrenzen: nach Code-Wert wäre die Reihenfolge eine andere.
const WX = [
  [c => c >= 95,                      "⛈️", "Gewitter"],
  [c => [56, 57, 66, 67].includes(c), "🧊", "Eisglätte"],
  [c => c >= 85,                      "🌨️", "Schneeschauer"],
  [c => c >= 71 && c <= 77,           "🌨️", "Schnee"],
  [c => c >= 80 && c <= 82,           "🌦️", "Regenschauer"],
  [c => c >= 61,                      "🌧️", "Regen"],
  [c => c >= 51,                      "🌦️", "Nieselregen"],
  [c => c >= 45,                      "🌫️", "Nebel"],
  [c => c === 3,                      "☁️", "bedeckt"],
  [c => c === 2,                      "⛅", "teils bewölkt"],
  [c => c === 1,                      "🌤️", "leicht bewölkt"],
  [() => true,                        "☀️", "klar"]
];
function wxRank(code) {
  return WX.findIndex(([test]) => test(code));
}
function weatherSymbol(code) {
  const [, sym, text] = WX[wxRank(code)];
  return [sym, text];
}
// Symbol für mehrere Stunden: das schwerste Wetter gewinnt, also der kleinste
// Rang. Math.max über die Rohcodes wäre falsch, weil WMO-Codes nicht monoton nach
// Schwere steigen — ein Regenschauer (80–82) gewänne gegen Schnee (71–77).
function worstSymbol(codes) {
  return weatherSymbol(codes.reduce((a, b) => (wxRank(b) < wxRank(a) ? b : a), 0));
}
// Notnagel, falls beim allerersten Start die Ortung fehlschlägt und noch nichts
// gespeichert ist — sonst gäbe es gar kein Wetter. Sonst wird nie geortet, ohne
// dass der Nutzer den Namen antippt.
const FALLBACK = { lat: 47.5596, lon: 7.5886, name: "Basel" };

// Aktuellen Standort abfragen (nur bei ausdrücklicher Aktion bzw. Erststart).
// maxAge = wie alt ein gecachter Geräte-Fix sein darf: beim bewussten Neu-Orten
// 0 (frische Messung), beim Erststart darf ein junger Cache-Fix genügen.
function getPos(maxAge) {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolve(null),
      { timeout: 6000, maximumAge: maxAge }
    );
  });
}

// geo.admin identify (nur Schweiz) auf einen Layer, gibt die results zurück.
async function geoIdentify(lat, lon, layer, limit) {
  const url = "https://api3.geo.admin.ch/rest/services/all/MapServer/identify"
    + "?geometry=" + lon + "," + lat
    + "&geometryType=esriGeometryPoint&geometryFormat=geojson&sr=4326"
    + "&layers=all:" + layer
    + "&imageDisplay=1000,1000,96&tolerance=0&limit=" + limit + "&returnGeometry=false";
  const res = await fetch(url);
  if (!res.ok) throw new Error("geo.admin " + res.status);
  return (await res.json()).results || [];
}

// Koordinaten -> Ortsname via geo.admin (nur Schweiz, erste Stufe des
// zweistufigen Fallbacks). Bevorzugt die Ortschaft (feiner, z. B. eingemeindete
// Namen mit eigener PLZ wie "Matten (St. Stephan)"), sonst die politische
// Gemeinde. Liefert null, wenn nichts passt oder der Dienst nicht erreichbar ist
// (= vermutlich Ausland → Aufrufer versucht dann den globalen Geocoder).
// Rückgabe { name, reached }: reached=true, sobald geo.admin geantwortet hat.
// So kann der Aufrufer "erreicht, aber kein CH-Treffer" (= echtes Ausland) von
// "Dienst nicht erreichbar" (Ausfall) unterscheiden und bei einem Ausfall nicht
// fälschlich Ausland cachen.
async function resolveName(lat, lon) {
  let reached = false;
  // 1. Ortschaftenverzeichnis: Ortschaftsname im Feld langtext
  try {
    const r = await geoIdentify(lat, lon, "ch.swisstopo-vd.ortschaftenverzeichnis_plz", 1);
    reached = true;
    if (r[0]?.properties?.langtext) return { name: r[0].properties.langtext, reached };
  } catch (e) {}
  // 2. Fallback politische Gemeinde. Der Layer enthält historische Jahresstände,
  // darum den aktuellen herauspicken (limit hoch genug für alle Jahre am Punkt).
  try {
    const r = await geoIdentify(lat, lon, "ch.swisstopo.swissboundaries3d-gemeinde-flaeche.fill", 200);
    reached = true;
    const cur = r.find(f => f.properties?.is_current_jahr === true);
    if (cur?.properties?.gemname) return { name: cur.properties.gemname, reached };
  } catch (e) {}
  return { name: null, reached };
}

// Koordinaten -> Ortsname global (zweite Stufe, Ausland) via BigDataCloud.
// Kein API-Key, CORS-fähig. Bevorzugt die Stadt, sonst die feinere Ortschaft.
// Liefert null bei Fehler oder ohne brauchbaren Namen (Aufrufer zeigt dann die
// Koordinaten). Fair Use: nur vom Gerät für dessen aktuelle Position aufrufen —
// erfüllt, da lat/lon aus getCurrentPosition stammen.
async function resolveNameGlobal(lat, lon) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  try {
    const url = "https://api-bdc.net/data/reverse-geocode-client"
      + "?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=de";
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error("bigdatacloud " + res.status);
    const d = await res.json();
    return d.city || d.locality || null;
  } catch (e) { return null; }
  finally { clearTimeout(timer); }
}

function coordName(lat, lon) {
  return lat.toFixed(2) + ", " + lon.toFixed(2);
}

// Standort bestimmen: gecacht (normales Öffnen) oder frisch orten (locate=true;
// Klick auf den Namen bzw. Erststart ohne Cache). Bei fehlgeschlagener Ortung
// bleibt der alte Standort erhalten (am Namen sieht man, dass nichts kam).
async function resolveLocation(locate, fresh) {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem("wetterLoc") || "null"); } catch (e) {}
  if (!locate && cached) return cached;
  const live = await getPos(fresh ? 0 : 600000);
  if (!live) return cached || { ...FALLBACK };
  // Stufe 1 geo.admin (CH): liefert es einen Namen → Schweiz (ch:true →
  // MeteoSwiss). War es erreichbar, fand aber nichts → echtes Ausland (ch:false →
  // best_match) und Stufe 2 global (BigDataCloud) für den Namen. War geo.admin
  // nicht erreichbar (Ausfall), bleibt ch unbestimmt: nicht als Ausland cachen,
  // Standort galt bisher als CH → Default-Modell MeteoSwiss.
  const geo = await resolveName(live.lat, live.lon);
  const loc = { lat: live.lat, lon: live.lon, name: geo.name };
  if (geo.name) {
    loc.ch = true;
  } else {
    loc.name = await resolveNameGlobal(live.lat, live.lon) || coordName(live.lat, live.lon);
    if (geo.reached) loc.ch = false;
  }
  localStorage.setItem("wetterLoc", JSON.stringify(loc));
  return loc;
}

async function loadWeather(pos) {
  // In der Schweiz das MeteoSwiss-Modell, im Ausland best_match (Open-Meteo
  // wählt automatisch das beste lokale Modell). Altbestand ohne ch-Feld gilt als
  // Schweiz (Standort war bisher immer CH).
  const model = pos.ch === false ? "best_match" : "meteoswiss_icon_seamless";
  const url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + pos.lat.toFixed(4)
    + "&longitude=" + pos.lon.toFixed(4)
    + "&hourly=apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day"
    + "&forecast_days=2&timezone=auto&models=" + model;
  const res = await fetch(url);
  if (!res.ok) throw new Error("API " + res.status);
  return res.json();
}

// Gefühlte Temperatur inkl. Fahrtwind: relative Anströmung = Windvektor minus
// Fahrvektor; die Differenz zur reinen Windgeschwindigkeit geht mit Steadmans
// Windterm (−0.7 °C pro m/s) in die gefühlte Temperatur ein.
function rideAdjust(tempAT, windKmh, windDirDeg, headingDeg) {
  const rad = Math.PI / 180;
  // Windrichtung ist "woher" — Luftbewegung zeigt in die Gegenrichtung
  const ax = -windKmh * Math.sin(windDirDeg * rad);
  const ay = -windKmh * Math.cos(windDirDeg * rad);
  const rx = RIDE_KMH * Math.sin(headingDeg * rad);
  const ry = RIDE_KMH * Math.cos(headingDeg * rad);
  const effKmh = Math.hypot(ax - rx, ay - ry);
  return tempAT - 0.7 * (effKmh - windKmh) / 3.6;
}

// Vor dem Formatieren vorzeichenrichtig auf digits Stellen runden und ein
// negatives Null auf 0 ziehen: sonst zeigt ein Wert in (-0.5, 0) „-0", an kalten
// Morgen real sichtbar. NaN bleibt NaN und wird nicht zu 0 verharmlost.
function fmt(n, digits = 0) {
  const p = 10 ** digits;
  const r = Math.sign(n) * Math.round(Math.abs(n) * p) / p;
  return (r === 0 ? 0 : r).toLocaleString("de-CH", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

// Nutzer-Eingaben (Fenster-Namen) landen in innerHTML/SVG → escapen.
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Anzeigewerte eines Fensters aus den Stundendaten. Von den Karten und der
// Tages-Kleiderempfehlung gemeinsam genutzt: die Empfehlung entsteht dadurch per
// Konstruktion aus genau den Zahlen, die auf den Karten stehen, und kann ihnen
// nie widersprechen.
function windowMetrics(h, w) {
  const heading = headingFor(w);
  // Alle Fenstergrössen werden mit dem Überlappungsanteil gewichtet, damit sie
  // die Fahrt beschreiben und nicht die berührten Datenstunden.
  const dur = w.slices.reduce((a, s) => a + s.ov, 0) || 1;
  const temp = w.slices.reduce((a, s) => {
    const t = h.apparent_temperature[s.i];
    const eff = (heading == null || h.wind_speed_10m?.[s.i] == null || h.wind_direction_10m?.[s.i] == null)
      ? t
      : rideAdjust(t, h.wind_speed_10m[s.i], h.wind_direction_10m[s.i], heading);
    return a + eff * s.ov;
  }, 0) / dur;
  const mm = w.slices.reduce((a, s) => a + (h.precipitation[s.i] ?? 0) * s.ov, 0);
  // Wahrscheinlichkeit und Symbol nur aus Stunden, die das Fenster nennenswert
  // abdecken: ein 10-Minuten-Ausläufer in die Nachbarstunde soll die Kachel
  // nicht dominieren. Der Fallback greift erst bei sehr langen Fenstern.
  const rel = w.slices.filter(s => s.ov >= 0.25 * dur);
  const relevant = rel.length ? rel : w.slices;
  const prob = Math.max(...relevant.map(s => h.precipitation_probability[s.i] ?? 0));
  // Gewitter bewusst über alle berührten Stunden: hier ist der Fehlalarm
  // billiger als der Fehltreffer.
  const thunder = w.slices.some(s => THUNDER_CODES.includes(h.weather_code[s.i]));
  const wet = prob >= 30 || mm >= 0.2 || thunder;
  // Sonnig nur bei klarem bis leicht bewölktem Himmel (Code ≤ 1) und Tageslicht:
  // dieselben relevanten Stunden wie das Kachel-Symbol, damit „Sonnenbrille" nie
  // neben lauter grauen Symbolen steht — und nicht bei der Fahrt im Dunkeln.
  const sunny = relevant.some(s => (h.weather_code[s.i] ?? 0) <= 1 && h.is_day?.[s.i] === 1);
  return { temp, mm, prob, thunder, wet, sunny, relevant };
}

// Tages-Kleiderempfehlung über alle Fenster des angezeigten Tages: angezogen wird
// einmal am Morgen, für den ganzen Tag. Vergangene Fenster zählen deshalb mit —
// die Zeile beschreibt den Morgen-Entscheid und springt nicht mittags um.
function renderAdvice(h, windows) {
  const el = document.getElementById("advice");
  const ms = windows.map(w => windowMetrics(h, w));
  el.hidden = !ms.length;
  if (!ms.length) return;
  const coldest = Math.min(...ms.map(m => m.temp));
  const band = BANDS.find(b => coldest >= b.min);
  el.innerHTML = (ms.some(m => m.wet) ? band.wet : band.dry)
    + (ms.some(m => m.sunny) ? ", Sonnenbrille" : "")
    + (ms.some(m => m.thunder) ? '<span class="thunder"> · Gewitter möglich</span>' : "");
}

function renderWindows(h, now, windows) {
  const box = document.getElementById("windows");
  box.innerHTML = "";
  // Das gerade relevante Fenster: das erste, das noch nicht zu Ende ist. Auf
  // „Morgen" (now < 0) gibt es keines, und sind alle Fenster vorbei, liefert
  // findIndex −1 — dann bleibt bewusst jede Karte unhervorgehoben.
  const act = now < 0 ? -1 : windows.findIndex(w => w.to > now);
  windows.forEach((w, i) => {
    const { temp, mm, prob, thunder, wet, relevant } = windowMetrics(h, w);
    // Vorbei ab der echten Endzeit des Fensters, nicht ab dem Ende der gröbsten
    // berührten Datenstunde: 17:00–17:30 ist um 17:30 vorbei, nicht erst um 18:00.
    const past = now >= 0 && now >= w.to;
    // Ist es trocken, ändert die Wahrscheinlichkeit nichts an der Kleiderwahl —
    // die Zahl entfällt. Bei Nässe entscheiden Prozent und Menge mit.
    let rainText = wet
      ? "Regen " + prob + " % · " + fmt(mm, 1) + " mm"
      : "trocken";
    if (thunder) rainText += " · Gewitter möglich";
    const [sym, symText] = worstSymbol(relevant.map(s => h.weather_code[s.i] ?? 0));
    const el = document.createElement("div");
    el.className = "win fade" + (past ? " past" : i === act ? " now" : "");
    el.dataset.id = w.id;
    el.innerHTML =
      '<div class="win-body" role="button" tabindex="0" aria-label="' + esc(w.label) + ' anpassen">' +
      '<div><span class="label">' + esc(w.label) + '</span>' +
      '<span class="time">' + w.time + '</span>' +
      (w.mode === "Velo"
        ? '<span class="mode">Velo · ' + dirLabel(w.heading) + '</span>'
        : '') + '</div>' +
      '<div class="sym" role="img" title="' + symText + '" aria-label="' + symText + '">' + sym + '</div>' +
      '<div class="temp">' + fmt(temp) + '<small>°</small></div>' +
      '<div class="rain' + (wet ? " wet" : "") + '">' + (past ? "vorbei · " : "") + rainText + '</div>' +
      '</div>';
    box.appendChild(el);
  });
}

// Basis-Zeitraum des Charts. Die Nacht interessiert einen Pendler nicht und würde
// nur ein Drittel der Breite verbrauchen; der Bereich wächst darum nur, wenn ein
// Fenster oder die Jetzt-Linie sonst aus dem Bild fiele.
const CHART_FROM = 6, CHART_TO = 22;
// Feste Bezugsgrösse der Regenbalken in mm/h: gleiche Balkenhöhe bedeutet damit an
// jedem Tag dasselbe. 3 mm/h liegt knapp über der Schwelle zu mässigem Regen.
const RAIN_FULL = 3;

// Textbreite in viewBox-Einheiten (für die Kollisionsprüfung der Fensterlabels,
// deren Namen frei gewählt sind). Der Chart wird leicht verkleinert dargestellt,
// darum ein kleiner Sicherheitszuschlag statt exakter Umrechnung.
// CSS-Variablen wirken nicht in SVG-Präsentationsattributen, die Farben müssen dort
// als Literale stehen. Statt sie zu duplizieren (und damit im zweiten Farbschema zu
// vergessen), werden sie beim Rendern aus dem aktuell geltenden Schema gelesen.
function palette() {
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue("--" + n).trim();
  return { ink: v("ink"), muted: v("muted"), line: v("line"), card: v("card"), warm: v("warm"), rain: v("rain") };
}

let measureCtx = null;
function textWidth(t, px) {
  if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
  measureCtx.font = px + 'px "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif';
  return measureCtx.measureText(t).width * 1.06;
}

function renderChart(h, now, windows) {
  const W = 420, H = 192, padL = 30, padR = 8, padT = 56, padB = 22;
  const col = palette();
  // Dargestellter Zeitraum, auf volle Stunden gerundet: im Normalfall Tag für Tag
  // derselbe (ruhiges Bild), erweitert nur um Fenster bzw. eine Jetzt-Linie
  // ausserhalb der Basis. Dadurch liegt garantiert alles Gezeichnete im Plotbereich.
  let t0 = CHART_FROM, t1 = CHART_TO;
  windows.forEach(w => {
    t0 = Math.min(t0, Math.floor(w.from));
    t1 = Math.max(t1, Math.ceil(w.to));
  });
  if (now >= 0) {
    t0 = Math.min(t0, Math.floor(now));
    t1 = Math.max(t1, Math.ceil(now));
  }
  t0 = Math.max(0, t0);
  t1 = Math.min(24, t1);
  // Temperatur ist ein Momentanwert zur vollen Stunde, Niederschlag die Summe über
  // [i, i+1) — daher die unterschiedlichen Indexbereiche. Für 24:00 gibt es keinen
  // Temperaturwert mehr, die Kurve endet dann bei 23:00.
  // Einzelne Stunden können in der Vorhersage fehlen (null). Solche Punkte werden
  // übersprungen — sonst würde eine Lücke die Achsengrenzen zu NaN machen und den
  // ganzen Chart unbrauchbar, statt nur einen Punkt zu kosten.
  const tPts = [], hoursR = [];
  for (let i = t0; i <= Math.min(t1, 23); i++) {
    if (h.apparent_temperature[i] != null) tPts.push([i, h.apparent_temperature[i]]);
  }
  for (let i = t0; i <= Math.min(t1 - 1, 23); i++) hoursR.push(i);
  const temps = tPts.map(p => p[1]);
  const rain = hoursR.map(i => h.precipitation[i] ?? 0);
  // Achsengrenzen auf Vielfache von 3 gerundet (mit mind. 1° Abstand zur Kurve),
  // damit die 3°-Hilfslinien immer auf mod-3-Zahlen liegen. Ohne einen einzigen
  // Temperaturwert bleibt eine neutrale Skala, damit Regen und Fenster lesbar sind.
  const tMin = temps.length ? Math.floor((Math.min(...temps) - 1) / 3) * 3 : 0;
  const tMax = temps.length ? Math.ceil((Math.max(...temps) + 1) / 3) * 3 : 12;
  const rMax = Math.max(RAIN_FULL, ...rain); // nur bei starkem Regen grösser als die feste Skala
  // Die x-Achse bildet neu die Zeit ab, nicht den Datenindex: t1 liegt exakt auf
  // dem rechten Rand.
  const x = t => padL + ((t - t0) / (t1 - t0)) * (W - padL - padR);
  const yT = v => padT + (1 - (v - tMin) / (tMax - tMin)) * (H - padT - padB);
  const yR = v => H - padB - (v / rMax) * (H - padT - padB) * 0.55;
  const tick0 = Math.ceil(t0 / 3) * 3; // erste 3-Stunden-Marke im Bereich

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Tagesverlauf gefühlte Temperatur und Regen">';

  // Hilfslinien: alle 3 h / 3 °C, Hauptlinien (alle 6) leicht kräftiger
  for (let hr = tick0; hr <= t1; hr += 3) {
    s += '<line x1="' + x(hr) + '" y1="' + padT + '" x2="' + x(hr) + '" y2="' + (H - padB) + '" stroke="' + col.ink + '" stroke-width="1" opacity="' + (hr % 6 === 0 ? 0.11 : 0.05) + '"/>';
  }
  for (let v = tMin; v <= tMax; v += 3) {
    s += '<line x1="' + padL + '" y1="' + yT(v) + '" x2="' + (W - padR) + '" y2="' + yT(v) + '" stroke="' + col.ink + '" stroke-width="1" opacity="' + (v % 6 === 0 ? 0.11 : 0.05) + '"/>';
  }

  // Wetter-Icons alle 3 h am oberen Rand; klar/bewölkt nachts als Mond/Wolke,
  // da weather_code nicht zwischen Tag und Nacht unterscheidet. Die x-Position
  // wird um höchstens eine halbe Icon-Breite eingerückt, damit ein Icon direkt am
  // Bereichsrand vollständig sichtbar bleibt.
  for (let hr = tick0; hr <= Math.min(t1, 23); hr += 3) {
    const code = h.weather_code[hr] ?? 0;
    let [sym, symText] = weatherSymbol(code);
    if (h.is_day?.[hr] === 0 && code <= 2) [sym, symText] = code <= 1 ? ["🌙", "klar"] : ["☁️", "bewölkt"];
    const ix = Math.max(padL + 14, Math.min(W - padR - 14, x(hr)));
    s += '<text x="' + ix + '" y="30" text-anchor="middle" font-size="28"' + (now >= hr + 1 ? ' opacity="0.42"' : '') + '><title>' + symText + '</title>' + sym + '</text>';
  }

  // Fenster-Zonen (echte Zeitfenster, nicht die Datenstunden)
  windows.forEach(w => {
    const x0 = x(w.from), x1 = x(w.to);
    s += '<rect x="' + x0 + '" y="' + padT + '" width="' + (x1 - x0) + '" height="' + (H - padT - padB) + '" fill="' + col.ink + '" opacity="0.06" rx="4"><title>' + esc(w.label) + ' ' + w.time + '</title></rect>';
  });

  // Fensterlabels kollisionsfrei setzen: ein 30-Minuten-Fenster ist schmaler als
  // sein Name, mehrere Labels würden sonst übereinanderliegen. Vorrang hat das
  // gerade relevante Fenster (läuft jetzt bzw. das nächste), danach chronologisch;
  // was nicht ohne Überlappung passt, entfällt. Die Zone bleibt sichtbar und trägt
  // den Namen als Tooltip.
  const boxes = windows.map((w, k) => {
    const bw = textWidth(w.label, 9) + 6;
    const cx = (x(w.from) + x(w.to)) / 2;
    const l = Math.max(padL, Math.min(W - padR - bw, cx - bw / 2));
    return { k, l, r: l + bw };
  });
  const act = Math.max(0, windows.findIndex(w => w.to > now));
  const placed = [];
  boxes.slice(act, act + 1).concat(boxes.filter(b => b.k !== act)).forEach(b => {
    if (placed.some(p => b.l < p.r + 3 && p.l < b.r + 3)) return;
    placed.push(b);
  });
  placed.forEach(b => {
    s += '<text x="' + ((b.l + b.r) / 2) + '" y="' + (padT - 4) + '" text-anchor="middle" font-size="9" fill="' + col.muted + '">' + esc(windows[b.k].label) + '</text>';
  });

  // Regenbalken über der Stunde, die sie beschreiben ([i, i+1) statt mittig auf der
  // Stundenmarke) — so decken sie sich mit den Fensterzonen.
  rain.forEach((v, k) => {
    if (v <= 0) return;
    const x0 = x(hoursR[k]) + 1, x1 = x(hoursR[k] + 1) - 1;
    s += '<rect x="' + x0 + '" y="' + yR(v) + '" width="' + (x1 - x0) + '" height="' + (H - padB - yR(v)) + '" fill="' + col.rain + '" opacity="0.75" rx="2"/>';
  });

  // Temperaturkurve
  if (tPts.length) {
    const path = tPts.map(([i, v], k) => (k ? "L" : "M") + x(i).toFixed(1) + " " + yT(v).toFixed(1)).join(" ");
    s += '<path d="' + path + '" fill="none" stroke="' + col.warm + '" stroke-width="2.5" stroke-linecap="round"/>';
  }

  // Spitzenwert des Regens anschreiben: ohne diese eine Zahl hat die Balkenhöhe
  // keinen ablesbaren Massstab. Kontur in Kartenfarbe, damit sie auch über der
  // Temperaturkurve lesbar bleibt.
  const peak = Math.max(0, ...rain);
  if (peak > 0) {
    const pk = rain.indexOf(peak);
    const txt = fmt(peak, 1) + " mm/h";
    const bw = textWidth(txt, 9);
    const cx = Math.max(padL + bw / 2, Math.min(W - padR - bw / 2, (x(hoursR[pk]) + x(hoursR[pk] + 1)) / 2));
    s += '<text x="' + cx + '" y="' + (yR(peak) - 4) + '" text-anchor="middle" font-size="9" fill="' + col.rain + '" stroke="' + col.card + '" stroke-width="2.5" paint-order="stroke">' + txt + '</text>';
  }

  // Jetzt-Linie
  if (now >= 0) {
    const nx = x(now);
    s += '<line x1="' + nx + '" y1="' + padT + '" x2="' + nx + '" y2="' + (H - padB) + '" stroke="' + col.ink + '" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>';
  }

  // Achsen-Labels an denselben 3-Stunden-Marken wie die Hilfslinien
  for (let hr = tick0; hr <= t1; hr += 3) {
    s += '<text x="' + x(hr) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="' + col.muted + '">' + hr + '</text>';
  }
  // Temperaturachse alle 6° angeschrieben (gleiche Major-Ticks wie die Zeitachse)
  for (let v = Math.ceil(tMin / 6) * 6; v <= tMax; v += 6) {
    s += '<text x="2" y="' + (yT(v) + 3) + '" font-size="9" fill="' + col.muted + '">' + v + '°</text>';
  }

  s += "</svg>";
  document.getElementById("chart").innerHTML = s;
}

// Windrose (im Fenster-Dialog eingebettet): 16 anklickbare Sektoren
// (data-angle = Fahrtrichtung des Fensters), aktueller Sektor in Schriftfarbe
// gefüllt. Farben wie im Chart über palette() aus dem aktuellen Schema.
function buildRose(heading) {
  const cx = 140, cy = 140, R = 110, lr = 128;
  const col = palette();
  const selIdx = Math.round(heading / 22.5) % 16;
  const pol = (deg, r) => [cx + r * Math.sin(deg * Math.PI / 180), cy - r * Math.cos(deg * Math.PI / 180)];
  let s = '<svg viewBox="0 0 280 280" role="group" aria-label="Windrose">';
  s += '<circle cx="140" cy="140" r="110" fill="none" stroke="' + col.line + '" stroke-width="1"/>';
  for (let i = 0; i < 16; i++) {
    const a = i * 22.5;
    const [x0, y0] = pol(a - 11.25, R);
    const [x1, y1] = pol(a + 11.25, R);
    const on = i === selIdx;
    s += '<path data-angle="' + a + '" style="cursor:pointer" '
      + 'd="M140 140 L' + x0.toFixed(1) + ' ' + y0.toFixed(1)
      + ' A110 110 0 0 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" '
      + 'fill="' + (on ? col.ink : col.card) + '" stroke="' + col.line + '" stroke-width="1"/>';
  }
  // Beschriftung der 8 Hauptrichtungen; N/O/S/W kräftiger
  [[0,"N",1],[45,"NO",0],[90,"O",1],[135,"SO",0],[180,"S",1],[225,"SW",0],[270,"W",1],[315,"NW",0]]
    .forEach(([a, t, big]) => {
      const [lx, ly] = pol(a, lr);
      s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="middle" '
        + 'font-size="' + (big ? 15 : 12) + '" font-weight="' + (big ? 700 : 600) + '" '
        + 'fill="' + (big ? col.ink : col.muted) + '">' + t + '</text>';
    });
  s += '<circle cx="140" cy="140" r="3" fill="' + col.muted + '"/>';
  s += '</svg>';
  return s;
}

let editingId = null;
let lastFocused = null;

// Der Fenster-Dialog ist modal (aria-modal): solange er offen ist, wird der Rest
// der Seite inert. Ohne das verlässt man ihn mit Tab nach hinten, statt im Dialog
// zu zirkulieren. Reihenfolge zählt — inert entzieht einem Element den Fokus,
// darum vorher merken und erst nach dem Aufheben zurückgeben.
function setBehindInert(on) {
  ["header", "#status", "#app"].forEach(sel => document.querySelector(sel).inert = on);
}

// Fenster-Dialog: Name, Fortbewegung, Start, Dauer und (bei Velo) Richtung anpassen.
function openWinEditor(id) {
  editingId = id;
  const w = windowsFor(currentSet).find(x => x.id === id);
  if (!w) return;
  document.getElementById("we-name").value = w.label;
  document.querySelectorAll("#we-mode button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === w.mode));
  document.getElementById("we-start").value = fmtTime(w.start);
  buildDurOptions(w.dur);
  updateDirRow(w);
  lastFocused = document.activeElement;
  document.getElementById("win-editor").hidden = false;
  setBehindInert(true);
  document.querySelector("#we-mode button[aria-pressed='true']")?.focus();
}
// Nach dem Entfernen ist die auslösende Karte weg (toAdd = true): Fokus auf „+"
// statt ins Leere.
function closeWinEditor(toAdd) {
  document.getElementById("win-editor").hidden = true;
  setBehindInert(false);
  if (toAdd) document.getElementById("addwin").focus();
  else lastFocused?.focus?.();
}
function fmtDur(h) {
  const H = Math.floor(h), M = Math.round((h - H) * 60);
  return H + ":" + String(M).padStart(2, "0");
}
function buildDurOptions(sel) {
  const vals = [];
  for (let d = 0.25; d <= 4.001; d += 0.25) vals.push(d);
  // Eine gespeicherte Dauer ausserhalb des Viertelstunden-Rasters wird einsortiert
  // und nicht vorangestellt — sonst stünde ein migriertes 1:20 vor 0:15. Die
  // Toleranz bleibt grob: sie fängt Werte, die auf die Minute dasselbe Label
  // ergeben, und verhindert damit zwei Optionen, die für den Nutzer identisch
  // aussehen. Der Wert selbst behält seine volle Genauigkeit, damit ein
  // Wiederwählen derselben Option die Dauer nicht minim verschiebt.
  if (!vals.some(d => Math.abs(d - sel) < 0.01)) {
    vals.push(sel);
    vals.sort((a, b) => a - b);
  }
  document.getElementById("we-dur").innerHTML = vals.map(d =>
    '<option value="' + d + '"' + (Math.abs(d - sel) < 0.01 ? " selected" : "") + '>'
    + fmtDur(d) + '</option>').join("");
}
// Richtungsbereich (eingebettete Windrose) im Fenster-Dialog: nur bei Velo.
function updateDirRow(w) {
  const box = document.getElementById("we-dir");
  box.hidden = w.mode !== "Velo";
  if (w.mode !== "Velo") return;
  document.getElementById("we-dirlbl").textContent = "Richtung: " + dirLabel(w.heading);
  document.getElementById("we-rose").innerHTML = buildRose(w.heading);
}
function pickHeading(deg) {
  updateWindow(currentSet, editingId, { heading: ((deg % 360) + 360) % 360 });
  updateDirRow(windowsFor(currentSet).find(x => x.id === editingId));
  render();
}

let hourlyData = null;
let posName = "";
let loadedAt = "";
let loadedAtMs = 0;
let loadedDate = "";
let currentDay = 0;
let currentSet = "arbeit";
let locating = false;

// Samstag/Sonntag standardmässig Freizeit-Fenster
function defaultSetFor(day) {
  const d = new Date();
  d.setDate(d.getDate() + day);
  const wd = d.getDay();
  return wd === 0 || wd === 6 ? "freizeit" : "arbeit";
}

function sliceDay(h, day) {
  const from = day * 24, to = from + 24;
  return {
    apparent_temperature: h.apparent_temperature.slice(from, to),
    precipitation_probability: h.precipitation_probability.slice(from, to),
    precipitation: h.precipitation.slice(from, to),
    weather_code: h.weather_code.slice(from, to),
    wind_speed_10m: h.wind_speed_10m.slice(from, to),
    wind_direction_10m: h.wind_direction_10m.slice(from, to),
    is_day: (h.is_day || []).slice(from, to)
  };
}

function renderDay(day) {
  currentDay = day;
  currentSet = defaultSetFor(day);
  render();
}

function renderSet(set) {
  currentSet = set;
  render();
}

// „Stand" trägt das Datum nur, wenn die Daten nicht von heute sind. onResume()
// schluckt einen fehlgeschlagenen Reload: nach einem Resume ohne Netz stehen
// sonst gestrige Zahlen unter einer Uhrzeit, die heute genauso plausibel aussieht.
function fmtStand() {
  const load = new Date(loadedAtMs);
  const today = new Date();
  if (load.toDateString() === today.toDateString()) return loadedAt;
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  if (load.toDateString() === yesterday.toDateString()) return "gestern " + loadedAt;
  return load.toLocaleDateString("de-CH", { day: "numeric", month: "numeric" }) + ", " + loadedAt;
}

function render() {
  // Nur den Text setzen, nicht die Zeile neu bauen: sonst ersetzt jedes Render den
  // Button und ein darauf liegender Fokus geht verloren (etwa während relocate()).
  document.getElementById("locmode").textContent = posName;
  document.getElementById("btn-today").setAttribute("aria-pressed", currentDay === 0);
  document.getElementById("btn-tomorrow").setAttribute("aria-pressed", currentDay === 1);
  document.getElementById("btn-arbeit").setAttribute("aria-pressed", currentSet === "arbeit");
  document.getElementById("btn-freizeit").setAttribute("aria-pressed", currentSet === "freizeit");
  // Eine gemeinsame Zeitbasis für Karten und Chart: Dezimalstunde, −1 auf „Morgen".
  const d = new Date();
  const now = currentDay === 0 ? d.getHours() + d.getMinutes() / 60 : -1;
  const windows = windowsFor(currentSet);
  const day = sliceDay(hourlyData, currentDay);
  renderAdvice(day, windows);
  renderWindows(day, now, windows);
  renderChart(day, now, windows);
  document.getElementById("foot").textContent =
    (windows.some(w => w.mode === "Velo") ? "VELO: gefühlt inkl. Fahrtwind (" + RIDE_KMH + " km/h) · " : "") +
    "Daten: Open-Meteo · Stand " + fmtStand();
}

// Klick auf den Namen: neu orten, Gemeinde auflösen und Wetter neu laden.
// Reload läuft asynchron; Doppel-Tipps werden blockiert.
async function relocate() {
  if (locating) return;
  locating = true;
  const modeEl = document.getElementById("locmode");
  if (modeEl) modeEl.textContent = "…";
  try { await loadData(true, true); } catch (e) {}
  render();
  locating = false;
}

async function loadData(locate, fresh) {
  const pos = await resolveLocation(locate, fresh);
  posName = pos.name;
  const data = await loadWeather(pos);
  hourlyData = data.hourly;
  const now = new Date();
  loadedAt = now.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" });
  loadedAtMs = now.getTime();
  loadedDate = now.toDateString();
}

async function init() {
  const status = document.getElementById("status");
  try {
    // Erststart ohne gespeicherten Standort: direkt orten. Sonst Cache nutzen.
    await loadData(!localStorage.getItem("wetterLoc"));
    document.getElementById("btn-today").onclick = () => renderDay(0);
    document.getElementById("btn-tomorrow").onclick = () => renderDay(1);
    document.getElementById("btn-arbeit").onclick = () => renderSet("arbeit");
    document.getElementById("btn-freizeit").onclick = () => renderSet("freizeit");
    renderDay(new Date().getHours() >= 20 ? 1 : 0);
    status.hidden = true;
    document.getElementById("toggles").hidden = false;
    document.getElementById("app").hidden = false;
  } catch (e) {
    status.textContent = "Wetterdaten konnten nicht geladen werden. Verbindung prüfen und Seite neu laden.";
  }
}

// iOS friert die Homescreen-App ein und stellt sie beim Öffnen ohne Neuladen
// wieder her. Deshalb beim Zurückkehren: neu rendern (Jetzt-Linie, ausgegraute
// Fenster), abgestandene Daten neu laden und auf eine neu deployte Version
// prüfen.
const STALE_MS = 10 * 60 * 1000;
let baselineHtml = null;
let refreshing = false;

function fetchSelf() {
  return fetch(location.pathname, { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  });
}

async function checkVersion() {
  try {
    const html = await fetchSelf();
    const changed = baselineHtml !== null && html !== baselineHtml;
    baselineHtml = html;
    if (!changed) return;
    const last = Number(sessionStorage.getItem("wetterReload")) || 0;
    if (Date.now() - last < 60000) return; // Schleifen-Schutz
    sessionStorage.setItem("wetterReload", Date.now());
    // Query-Parameter umgeht Browser- und CDN-Cache, sonst käme wieder die alte Version
    location.replace(location.pathname + "?u=" + Date.now());
  } catch (e) {}
}

async function onResume() {
  if (refreshing) return;
  refreshing = true;
  try {
    checkVersion();
    if (!hourlyData) { await init(); return; }
    const dayChanged = new Date().toDateString() !== loadedDate;
    if (dayChanged || Date.now() - loadedAtMs > STALE_MS) {
      try { await loadData(); } catch (e) {}
    }
    if (dayChanged) renderDay(new Date().getHours() >= 20 ? 1 : 0);
    else render();
  } finally {
    refreshing = false;
  }
}

// Chart und Windrose tragen ihre Farben als SVG-Attribute, die beim Rendern
// festgeschrieben werden. Schaltet iOS nachts automatisch auf Dunkel, während die
// App eingefroren im Hintergrund liegt, blieben sie sonst im alten Schema stehen.
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (hourlyData) render();
  if (editingId !== null) {
    const w = windowsFor(currentSet).find(x => x.id === editingId);
    if (w) updateDirRow(w);
  }
});

window.addEventListener("pageshow", e => { if (e.persisted) onResume(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) onResume(); });
document.getElementById("loc").addEventListener("click", e => {
  if (e.target.closest("#locmode")) relocate();
});
document.getElementById("windows").addEventListener("click", e => {
  const el = e.target.closest(".win");
  if (el) openWinEditor(el.dataset.id);
});
document.getElementById("addwin").addEventListener("click", () => {
  const id = addWindow(currentSet);
  render();
  openWinEditor(id);
});
document.getElementById("win-editor").addEventListener("click", e => {
  if (e.target === e.currentTarget || e.target.closest("#we-close")) return closeWinEditor();
  if (e.target.closest("#we-remove")) {
    removeWindow(currentSet, editingId);
    render();
    return closeWinEditor(true);
  }
  const modeBtn = e.target.closest("#we-mode button");
  if (modeBtn) {
    updateWindow(currentSet, editingId, { mode: modeBtn.dataset.mode });
    const w = windowsFor(currentSet).find(x => x.id === editingId);
    document.querySelectorAll("#we-mode button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.mode === w.mode));
    updateDirRow(w);
    render();
    return;
  }
  const seg = e.target.closest("[data-angle]");
  if (seg) pickHeading(Number(seg.getAttribute("data-angle")));
});
document.getElementById("we-start").addEventListener("change", e => {
  // Leeres Feld (z. B. via „löschen") nicht als Mitternacht speichern
  if (!e.target.value) {
    const cur = windowsFor(currentSet).find(x => x.id === editingId);
    if (cur) e.target.value = fmtTime(cur.start);
    return;
  }
  updateWindow(currentSet, editingId, { start: parseTime(e.target.value) });
  render();
});
// Name live speichern; beim Verlassen leeres Feld auf Standard zurücksetzen.
document.getElementById("we-name").addEventListener("input", e => {
  updateWindow(currentSet, editingId, { label: e.target.value });
  render();
});
document.getElementById("we-name").addEventListener("change", e => {
  if (!e.target.value.trim()) {
    e.target.value = "Fenster";
    updateWindow(currentSet, editingId, { label: "Fenster" });
    render();
  }
});
// Tastatur: Fenster-Karten mit Enter/Space öffnen, Dialog mit Escape schliessen
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("win-editor").hidden) return closeWinEditor();
  if (e.key === "Enter" || e.key === " ") {
    const body = e.target.closest?.(".win-body");
    if (body) { e.preventDefault(); openWinEditor(body.closest(".win").dataset.id); }
  }
});
document.getElementById("we-dur").addEventListener("change", e => {
  updateWindow(currentSet, editingId, { dur: Number(e.target.value) });
  render();
